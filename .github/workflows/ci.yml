name: ci

# Every pull request and every push to main must pass these checks. With branch protection on main
# (see docs/ci.md), Vercel only ever deploys code that passed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: types and content rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Confidential-terms list is configured
        run: test -n "$PUBLIC_CONTENT_BLOCKLIST" || { echo "Set the PUBLIC_CONTENT_BLOCKLIST secret (one term per line)"; exit 1; }
        env: { PUBLIC_CONTENT_BLOCKLIST: "${{ secrets.PUBLIC_CONTENT_BLOCKLIST }}" }
      - name: Public-content guardrail
        run: node scripts/check-public-content.mjs
        env: { PUBLIC_CONTENT_BLOCKLIST: "${{ secrets.PUBLIC_CONTENT_BLOCKLIST }}" }
      - name: Type check
        run: |
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts
          pnpm exec tsc --noEmit
      - name: Content rules (dates, sources, house style)
        run: pnpm exec playwright test playwright/tests/content.spec.ts --project=chromium
        env: { CI: "" }

  build-and-test:
    name: build, end-to-end tests, links
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: checks
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the footer reads the last commit date
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build (includes the confidential-terms check)
        run: pnpm build
        env: { PUBLIC_CONTENT_BLOCKLIST: "${{ secrets.PUBLIC_CONTENT_BLOCKLIST }}" }
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests against the production build
        run: pnpm exec playwright test playwright/tests/site.spec.ts playwright/tests/features.spec.ts
        env: { CI: "true" }
      - name: Internal link check
        run: |
          pnpm start &
          npx --yes wait-on@8.0.1 http://localhost:3000 --timeout 60000
          node scripts/check-links.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
